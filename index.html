<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal API | Admin</title>
    <style>
        /* Sleek iOS Glassmorphism UI */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #1d1d1f;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        p { font-size: 14px; color: #515154; margin-bottom: 16px; }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
            outline: none;
            transition: border 0.2s;
            margin-bottom: 16px;
        }
        
        input:focus { border-color: #007aff; }

        button {
            width: 100%;
            padding: 14px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        button:active { background: #005bb5; transform: scale(0.98); }

        .key-box {
            margin-top: 16px;
            padding: 14px;
            background: rgba(0,0,0,0.04);
            border-radius: 12px;
            font-family: monospace;
            font-size: 14px;
            word-break: break-all;
            display: none;
            border: 1px dashed rgba(0,0,0,0.2);
        }

        /* Table Styles for Models */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        th { font-weight: 600; color: #86868b; }
        code { background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 6px; font-family: monospace; }
    </style>
</head>
<body>

    <!-- KEY GENERATOR UI -->
    <div class="glass-panel">
        <h2>Generate API Key</h2>
        <p>Enter your admin secret to authorize a new user key.</p>
        
        <input type="password" id="adminSecret" placeholder="Admin Secret Password">
        <button onclick="generateKey()">Create New Key</button>
        
        <div id="resultBox" class="key-box"></div>
    </div>

    <!-- MODEL REFERENCE UI -->
    <div class="glass-panel">
        <h2>Available Models</h2>
        <p>Active Cloudflare LLMs and token limits.</p>
        
        <table>
            <tr>
                <th>Model ID</th>
                <th>Tokens</th>
            </tr>
            <tr>
                <td><code>@cf/mistral/mistral-7b-instruct-v0.1</code></td>
                <td>8192</td>
            </tr>
            <tr>
                <td><code>@cf/google/gemma-7b-it</code></td>
                <td>8192</td>
            </tr>
            <tr>
                <td><code>@cf/qwen/qwen1.5-14b-chat-awq</code></td>
                <td>32768</td>
            </tr>
            <tr>
                <td><code>@cf/microsoft/phi-2</code></td>
                <td>2048</td>
            </tr>
        </table>
    </div>

    <script>
        async function generateKey() {
            const secret = document.getElementById('adminSecret').value;
            const resultBox = document.getElementById('resultBox');
            
            if (!secret) {
                alert("Please enter the Admin Secret!");
                return;
            }

            resultBox.style.display = "block";
            resultBox.innerHTML = "Generating securely...";
            resultBox.style.color = "#515154";

            try {
                // REPLACE THIS URL WITH YOUR ACTUAL WORKER URL
                const response = await fetch("https://crystal-api.<your-subdomain>.workers.dev/v1/create-key", {
                    method: "POST",
                    headers: {
                        "X-Admin-Secret": secret
                    }
                });

                const data = await response.json();

                if (data.status === "success") {
                    resultBox.innerHTML = `<strong>Success!</strong><br><br>${data.api_key}<br><br><span style="font-size:12px; color:#86868b;">Copied to database.</span>`;
                    resultBox.style.color = "#000";
                } else {
                    resultBox.innerHTML = `<span style="color:#ff3b30">Error: ${data.error}</span>`;
                }

            } catch (err) {
                resultBox.innerHTML = `<span style="color:#ff3b30">Network Error. Is the API URL correct?</span>`;
            }
        }
    </script>
</body>
</html>
